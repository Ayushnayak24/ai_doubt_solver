
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | MindSolve AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Segoe UI, Arial, sans-serif;
    background: #080b18;
    color: #f8fafc;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: #11182a;
    border: 1px solid #283650;
    border-radius: 20px;
    padding: 38px;
    box-shadow: 0 20px 70px #0005;
}

.logo {
    text-align: center;
    font-size: 25px;
    font-weight: 800;
    color: #a78bfa;
    margin-bottom: 30px;
}

.logo span {
    color: white;
}

.icon {
    width: 75px;
    height: 75px;
    border-radius: 20px;
    background: #29204c;
    display: grid;
    place-items: center;
    font-size: 32px;
    margin: 0 auto 22px;
}

h1 {
    text-align: center;
    font-size: 27px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 28px;
}

label {
    display: block;
    color: #cbd5e1;
    font-size: 12px;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 14px;
    background: #0b1222;
    border: 1px solid #303c55;
    border-radius: 9px;
    color: white;
    outline: none;
    margin-bottom: 18px;
}

input:focus {
    border-color: #8b5cf6;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(100deg,#7c3aed,#4f46e5);
    border: 0;
    border-radius: 9px;
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    font-size: 13px;
    line-height: 1.6;
    margin-top: 16px;
    text-align: center;
}

.back {
    text-align: center;
    margin-top: 25px;
    font-size: 13px;
    color: #94a3b8;
}

.back a {
    color: #c4b5fd;
    text-decoration: none;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<main class="container">

    <div class="logo">MindSolve <span>AI.</span></div>

    <div class="icon">🔐</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter your registered email and choose a new password
        for your MindSolve AI account.
    </p>

    <form id="resetForm">

        <label for="email">Registered Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <label for="newPassword">New Password</label>
        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password (minimum 8 characters)"
            minlength="8"
            required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your new password"
            minlength="8"
            required
        >

        <button type="submit" id="resetButton">
            Reset Password →
        </button>

    </form>

    <p class="message" id="message"></p>

    <div class="back">
        Remember your password?
        <a href="/login">Login here</a>
    </div>

    <footer>
        © 2026 MindSolve AI · Learn Smarter. Grow Faster.
    </footer>

</main>

<script>
const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("resetButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    message.textContent = "";
    message.style.color = "#fca5a5";

    if (newPassword !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "Updating Password...";

    try {

        const response = await fetch("/api/reset-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                new_password: newPassword,
                confirm_password: confirmPassword
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Password reset failed.");
        }

        message.style.color = "#86efac";
        message.textContent = data.message;

        form.reset();

    } catch (error) {

        message.style.color = "#fca5a5";
        message.textContent = error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Reset Password →";

    }

});
</script>

</body>
</html>
