
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join MindSolve AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #24345f, #080d1c 65%);
            color: white;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #9daeff;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aeb9d3;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #394665;
            background: #111a30;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #8299ff;
            box-shadow: 0 0 10px #536fff55;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(100deg, #647cff, #a05cff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px #647cff55;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ffaaaa;
        }

        .login {
            text-align: center;
            margin-top: 23px;
            color: #b5bfd5;
            font-size: 14px;
        }

        a {
            color: #a4b2ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">✦ MindSolve AI</div>

        <h1>Create Account</h1>
        <p class="subtitle">Start your smarter learning journey today.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>

            <button type="submit" id="registerBtn">Create Account →</button>
        </form>

        <p id="message" role="status"></p>

        <div class="login">
            Already have an account?
            <a href="/login">Login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Creating account...";

            const data = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Registration failed.");
                }

                message.style.color = "#86efac";
                message.textContent = "Account created successfully!";

                window.location.href = result.redirect || "/dashboard";

            } catch (error) {
                message.style.color = "#ffaaaa";
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Create Account →";
            }
        });
    </script>
</body>
</html>
